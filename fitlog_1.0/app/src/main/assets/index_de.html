<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>FitLog</title>
<style>
:root{
  --bg:#0b0f14; --card:#121923; --card2:#17202c; --line:#263244; --text:#f4f7fb; --muted:#a8b3c2;
  --accent:#79ffb8; --accent2:#82aaff; --danger:#ff7a90; --warn:#ffd166; --ok:#74f2ce; --keyboard-offset:0px;
  --chest:#ff8a8a; --shoulder:#93c5fd; --triceps:#c084fc; --back:#34d399; --biceps:#fbbf24; --abs:#fb7185; --legs:#a3e635; --cardio:#22d3ee; --rest:#94a3b8;
}
*{box-sizing:border-box}
html,body{margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:760px; margin:0 auto; padding:16px 14px 26px;}
body.setupMode .app{padding-bottom:26px}
header{position:sticky; top:0; z-index:20; background:linear-gradient(180deg,rgba(11,15,20,.98),rgba(11,15,20,.86)); backdrop-filter:blur(14px); padding:14px 0 10px;}
.top{display:flex; align-items:center; gap:12px; justify-content:space-between;}
h1{font-size:22px; margin:0; letter-spacing:-.02em; line-height:1.08}.small{font-size:12px; color:var(--muted); line-height:1.35}.topActions{display:flex; gap:8px; align-items:center}.dayPickerWrap{flex:1;min-width:0}.daySelect{appearance:none;-webkit-appearance:none;width:100%;border:1px solid #37556b;background:linear-gradient(135deg,#152234,#101722);color:var(--text);border-radius:18px;padding:14px 42px 14px 14px;font-size:17px;font-weight:1000;letter-spacing:-.01em;background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);background-position:calc(100% - 22px) 19px,calc(100% - 15px) 19px;background-size:7px 7px,7px 7px;background-repeat:no-repeat}.setupHeaderTitle{font-size:22px;font-weight:1000;letter-spacing:-.02em;flex:1}.iconBtn{width:42px;height:42px;border:1px solid var(--line);border-radius:15px;background:#101722;color:var(--text);font-size:20px;font-weight:900;display:grid;place-items:center}.iconBtn.setupBack{width:52px;height:52px;border-radius:18px;font-size:30px}.iconBtn:active,.btn:active,.miniBtn:active{transform:scale(.98)}
.tabs{display:flex; gap:8px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap; border:1px solid var(--line); background:#101722; color:var(--muted); padding:10px 13px; border-radius:999px; font-weight:800; font-size:13px}.tab.active{background:linear-gradient(135deg,#1c2b3c,#163021); color:var(--text); border-color:#37556b; box-shadow:0 0 0 1px rgba(121,255,184,.1) inset}
.dayHead{background:linear-gradient(135deg,#121923,#162233); border:1px solid var(--line); border-radius:24px; padding:16px; margin:12px 0 14px; box-shadow:0 12px 28px rgba(0,0,0,.22)}.dayTitle{font-size:20px; font-weight:1000; margin-bottom:6px}.daySub{color:var(--muted); line-height:1.35; font-size:13px}.controls{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}.btn{border:1px solid var(--line); border-radius:14px; background:#17202c; color:var(--text); padding:11px 12px; font-weight:900; text-align:center}.btn.primary{background:linear-gradient(135deg,#143323,#1d3550); border-color:#35664e; color:#fff}.btn.warn{background:#2a1e17; border-color:#5c3d1f}.btn.danger{background:#2a1218;border-color:#743244;color:#ffe1e7}.progressBox{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; margin-top:12px}.bar{height:10px; background:#0d131c; border-radius:999px; border:1px solid #243146; overflow:hidden}.fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:999px; transition:width .25s}
.card{border:1px solid var(--line); background:var(--card); border-radius:24px; padding:14px; margin:12px 0; box-shadow:0 10px 24px rgba(0,0,0,.18); position:relative; overflow:hidden}.card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--cat,#64748b); opacity:.9}.card.done{opacity:1}.card.done .exName{text-decoration:none; color:var(--text)}.exTop{display:flex; gap:12px; justify-content:space-between; align-items:flex-start}.nr{min-width:30px; height:30px; display:grid; place-items:center; border-radius:10px; background:var(--card2); color:var(--accent); font-weight:1000; font-size:13px}.exName{font-weight:1000; font-size:17px; line-height:1.25}.focus{display:inline-block; margin-top:7px; border:1px solid rgba(255,255,255,.12); color:#e5eef8; background:rgba(255,255,255,.055); padding:5px 8px; border-radius:999px; font-size:12px; font-weight:900}.check{display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; font-weight:900}.check input{width:22px; height:22px; accent-color:#69f0ae}
.planDetails{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px}.planItem{padding:4px 0 7px; border-bottom:1px solid rgba(255,255,255,.075)}.planItem .label{margin-bottom:3px}.planItem .value{font-weight:900;font-size:14px;line-height:1.25}.planItem.wide{grid-column:1/-1}.warmPill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-weight:1000;font-size:12px;background:rgba(121,255,184,.10);border:1px solid rgba(121,255,184,.20);color:#eafff4}.warmPill.no{background:rgba(148,163,184,.10);border-color:rgba(148,163,184,.22);color:#dbe4ef}
.label{font-size:11px; color:var(--muted); font-weight:900; text-transform:uppercase; letter-spacing:.04em}.tracker{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:13px}.tracker .wide{grid-column:1/-1}.trackBox{background:#0e141d;border:1px solid #1f2b3b;border-radius:16px;padding:10px}.trackBox.compact{padding:8px}.trackBox.compact input{padding:8px;font-size:14px}.trackBox .label{margin-bottom:6px}input,textarea,select{width:100%; border:1px solid #334257; background:#0b1119; color:var(--text); border-radius:12px; padding:10px; font-size:15px; outline:none}textarea{min-height:42px; resize:none; overflow:hidden; line-height:1.35} textarea.autoGrow{min-height:42px;height:42px;box-sizing:border-box}.setupField textarea.autoGrow{min-height:42px;height:42px;line-height:1.35;overflow:hidden;resize:none}.trackInput{border-color:#3b526d;background:#08111b;box-shadow:0 0 0 1px rgba(130,170,255,.04) inset}.actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}.exerciseActions{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px;align-items:stretch}.miniBtn{border:1px solid #2a384c; background:#101823; color:#dbeafe; border-radius:12px; padding:9px 10px; font-size:13px; font-weight:900}.miniBtn.good{border-color:#2e6b52; background:#10251d}.miniBtn.danger{border-color:#6b2e3e; background:#251018}.pauseBtn{font-size:17px;padding:17px 14px;border-radius:16px;background:linear-gradient(135deg,#172c45,#122235);border-color:#385a7b}.finishBtn{font-size:15px;padding:13px 12px;border-radius:15px}details{margin-top:10px}summary{color:var(--muted); font-size:13px; font-weight:900; cursor:pointer}.history{margin-top:8px; border-top:1px solid #243146; padding-top:8px}.histItem{font-size:12px; color:#dbe4ef; padding:6px 0; border-bottom:1px solid #1a2432}
.modal{position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:40; display:none; align-items:flex-end; padding-bottom:var(--keyboard-offset); transition:padding-bottom .16s ease}.modal.open{display:flex}.modal.upperHalf{align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top) + 10vh) 14px var(--keyboard-offset)}.modal.upperHalf .sheet{border-radius:24px;max-height:min(50vh,calc(100vh - var(--keyboard-offset) - 24vh));box-shadow:0 18px 44px rgba(0,0,0,.42)}.modal.timerFloating{background:transparent;pointer-events:none}.modal.timerFloating .sheet{pointer-events:auto;box-shadow:0 -12px 32px rgba(0,0,0,.42)}.sheet{width:100%; max-width:760px; margin:0 auto; background:#111823; border-radius:24px 24px 0 0; border:1px solid var(--line); padding:18px; max-height:min(82vh,calc(100vh - var(--keyboard-offset) - 18px)); overflow:auto}pre{white-space:pre-wrap; word-break:break-word; background:#0b1119; border:1px solid #25334a; border-radius:14px; padding:12px; font-size:12px}.timer{font-size:30px; font-weight:1000; letter-spacing:.02em; color:var(--accent)}
.card.active{border-color:rgba(121,255,184,.34);box-shadow:0 16px 34px rgba(0,0,0,.28),0 0 0 1px rgba(121,255,184,.08) inset;background:linear-gradient(180deg,#142033,#101722)}
.card.finishing{animation:finishCard .78s cubic-bezier(.45,.04,.25,1) forwards;pointer-events:none;position:relative;z-index:1}
.card.exerciseSwitchOut{animation:exerciseSwitchOut .24s ease forwards;pointer-events:none}
.card.exerciseSwitchIn{animation:exerciseSwitchIn .34s cubic-bezier(.2,.8,.2,1) both}
.finishOverlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:6;overflow:visible}
.finishCheckHalo{position:absolute;left:50%;top:50%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(121,255,184,.55),rgba(121,255,184,.18) 55%,transparent 72%);transform:translate(-50%,-50%) scale(.4);opacity:0;animation:finishHalo .78s cubic-bezier(.16,1,.3,1) forwards;filter:blur(2px);mix-blend-mode:screen}
.finishCheck{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#c4ffd9,#34d399 55%,#10b981 100%);display:grid;place-items:center;color:#04130a;font-size:48px;font-weight:1000;line-height:1;box-shadow:0 14px 36px rgba(0,0,0,.45),0 0 0 0 rgba(121,255,184,.6),inset 0 1px 2px rgba(255,255,255,.5);animation:finishCheckPop .78s cubic-bezier(.16,1.25,.38,1) forwards;will-change:transform,opacity,filter;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.finishParticle{position:absolute;left:50%;top:50%;border-radius:50%;background:radial-gradient(circle,#e7ffef,#7dffc0 45%,#34d399);box-shadow:0 0 10px rgba(121,255,184,.7),0 0 18px rgba(121,255,184,.35);opacity:0;animation:finishParticle .58s cubic-bezier(.2,.6,.35,1) forwards;will-change:transform,opacity;pointer-events:none}
.finishSpark{position:absolute;left:50%;top:50%;width:2px;height:14px;border-radius:2px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(121,255,184,0));opacity:0;animation:finishSpark .42s ease-out forwards;will-change:transform,opacity;pointer-events:none;transform-origin:50% 0}
@keyframes finishCard{0%{opacity:1;transform:translateY(0) scale(1);max-height:900px;filter:blur(0) brightness(1)}22%{opacity:1;transform:scale(1.012);filter:brightness(1.18)}48%{opacity:.92;transform:scale(.99);filter:blur(.4px) brightness(1.05)}72%{opacity:.45;transform:translateY(-6px) scale(.97);filter:blur(1.2px) brightness(.95)}100%{opacity:0;transform:translateY(-22px) scale(.92);max-height:0;margin:0;padding-top:0;padding-bottom:0;border-width:0;filter:blur(3px) brightness(.85)}}
@keyframes finishCheckPop{0%{opacity:0;transform:scale(.2) rotate(-22deg)}14%{opacity:1;transform:scale(1.18) rotate(2deg);box-shadow:0 14px 36px rgba(0,0,0,.45),0 0 0 10px rgba(121,255,184,.28),inset 0 1px 2px rgba(255,255,255,.6)}28%{transform:scale(1) rotate(0);box-shadow:0 14px 36px rgba(0,0,0,.45),0 0 0 0 rgba(121,255,184,0),inset 0 1px 2px rgba(255,255,255,.5)}48%{opacity:1;transform:scale(1.55) rotate(0);box-shadow:0 0 60px 14px rgba(121,255,184,.45),inset 0 1px 2px rgba(255,255,255,.55)}62%{opacity:.95;transform:scale(2.1) rotate(0);filter:blur(.6px) brightness(1.15)}100%{opacity:0;transform:scale(3.4) rotate(0);filter:blur(8px) brightness(1.2);box-shadow:0 0 120px 30px rgba(121,255,184,0)}}
@keyframes finishHalo{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:.9;transform:translate(-50%,-50%) scale(1.1)}60%{opacity:.55;transform:translate(-50%,-50%) scale(1.8)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.8)}}
@keyframes finishParticle{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}18%{opacity:1;transform:translate(-50%,-50%) translate(calc(var(--dx)*.16),calc(var(--dy)*.16)) scale(1) rotate(calc(var(--rot)*.3))}100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.15) rotate(var(--rot));filter:blur(2px)}}
@keyframes finishSpark{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot)) translateY(0) scaleY(.4)}30%{opacity:1;transform:translate(-50%,-50%) rotate(var(--rot)) translateY(calc(var(--dist)*.4)) scaleY(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot)) translateY(var(--dist)) scaleY(.2)}}
@keyframes exerciseSwitchOut{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-10px) scale(.985)}}
@keyframes exerciseSwitchIn{0%{opacity:0;transform:translateY(14px) scale(.985)}70%{opacity:1;transform:translateY(-2px) scale(1.003)}100%{opacity:1;transform:translateY(0) scale(1)}}
.queueTitle{margin:16px 2px 8px;color:var(--muted);font-size:12px;font-weight:1000;text-transform:uppercase;letter-spacing:.06em}
.compactCard{border:1px solid var(--line);background:#101722;border-radius:18px;padding:12px 12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.14);cursor:pointer;transition:transform .16s ease,border-color .16s ease,background .16s ease}
.compactCard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cat,#64748b);opacity:.85}
.compactCard.done{opacity:.68;background:#0d141e}
.compactCard:active{transform:scale(.985)}
.compactCard.opened{border-color:rgba(121,255,184,.34);background:#142033}
.compactMain{display:flex;align-items:center;gap:10px;min-width:0;padding-left:2px}
.compactNr{min-width:28px;height:28px;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--accent);font-weight:1000;font-size:12px}
.compactName{font-weight:1000;font-size:15px;line-height:1.22;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compactCard.done .compactName{text-decoration:line-through;color:#cbd5e1}
.compactStatus{font-size:11px;font-weight:1000;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 7px;color:var(--muted);white-space:nowrap}
.doneSummary{border:1px solid rgba(121,255,184,.34);background:radial-gradient(circle at 50% 0%,rgba(121,255,184,.22),transparent 46%),linear-gradient(135deg,#112318,#132133);border-radius:28px;padding:30px 20px;margin:12px 0 18px;color:#eafff4;font-weight:1000;text-align:center;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 18px 42px rgba(0,0,0,.34),0 0 0 1px rgba(121,255,184,.08) inset;overflow:hidden;position:relative}
.doneSummary::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 180deg,transparent,rgba(121,255,184,.18),transparent,rgba(130,170,255,.14),transparent);opacity:.55;animation:doneGlow 3.2s linear infinite}
.doneSummary>*{position:relative;z-index:1}.doneIcon{font-size:52px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.35))}.doneSummary h2{font-size:30px;line-height:1.05;margin:0 0 8px;letter-spacing:-.04em}.doneSummary p{margin:0;color:#cfeadd;font-size:14px;line-height:1.35;max-width:420px}.doneSummary.celebrate{animation:trainingCompleteIn .82s cubic-bezier(.16,1.08,.38,1) both}.doneSummary.celebrate .doneIcon{animation:doneIconPop .95s cubic-bezier(.16,1.08,.38,1) both}
@keyframes trainingCompleteIn{0%{opacity:0;transform:translateY(-22px) scale(.92);filter:blur(2px)}62%{opacity:1;transform:translateY(3px) scale(1.035);filter:blur(0)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes doneIconPop{0%{opacity:0;transform:scale(.4) rotate(-10deg)}55%{opacity:1;transform:scale(1.18) rotate(5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes doneGlow{to{transform:rotate(360deg)}}

#main.dayLeaving > *{animation:daySwitchOut .22s ease forwards;pointer-events:none}
#main.dayEntering > *{animation:daySwitchIn .34s cubic-bezier(.2,.8,.2,1) both}
#main.dayEntering > *:nth-child(1){animation-delay:.02s}
#main.dayEntering > *:nth-child(2){animation-delay:.05s}
#main.dayEntering > *:nth-child(3){animation-delay:.08s}
#main.dayEntering > *:nth-child(4){animation-delay:.11s}
#main.dayEntering > *:nth-child(5){animation-delay:.14s}
#main.dayEntering > *:nth-child(n+6){animation-delay:.16s}
@keyframes daySwitchOut{0%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}100%{opacity:0;transform:translateY(10px) scale(.985);filter:blur(1.5px)}}
@keyframes daySwitchIn{0%{opacity:0;transform:translateY(16px) scale(.985);filter:blur(1.5px)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
.setupIntro{background:linear-gradient(135deg,#121923,#161f2c);border:1px solid var(--line);border-radius:22px;padding:14px;margin:12px 0;color:#dbe4ef}.daySetup{border:1px solid var(--line);border-radius:22px;background:#101722;margin:12px 0;overflow:hidden}.daySetup>summary{list-style:none;padding:14px 15px;font-size:16px;color:var(--text);display:flex;align-items:center;justify-content:space-between}.daySetup>summary::-webkit-details-marker{display:none}.daySetupBody{padding:0 12px 14px}.setupGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.setupGrid .wide{grid-column:1/-1}.setupField{background:#0d141e;border:1px solid #202b3c;border-radius:16px;padding:10px}.setupField .label{margin-bottom:6px}.setupExercise{border:1px solid #253245;border-radius:20px;background:#121b27;padding:12px;margin:12px 0;position:relative;overflow:hidden}.setupExercise::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cat,#64748b)}.setupExHead{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}.setupExTitle{font-weight:1000;line-height:1.2}.deleteBtn{border:1px solid #743244;background:#261018;color:#ffd9e2;border-radius:12px;padding:8px 10px;font-weight:1000}.addBtn{width:100%;border:1px dashed #4a6f5e;background:#102018;color:#eafff4;border-radius:16px;padding:13px;font-weight:1000;margin-top:10px}.setupBar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.dangerText{color:var(--danger)}

.syncBadge{border:1px solid var(--line);background:#101722;color:var(--muted);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:1000;white-space:nowrap}.syncBadge.on{color:#eafff4;border-color:#2e6b52;background:#10251d}.syncBadge.err{color:#ffe1e7;border-color:#743244;background:#2a1218}
.toolsCard{background:linear-gradient(135deg,#111923,#151f2d);border:1px solid var(--line);border-radius:22px;padding:14px;margin:16px 0 20px;box-shadow:0 10px 24px rgba(0,0,0,.16)}.toolsCard h2{font-size:18px;margin:0 0 6px}.toolsGrid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}.toolsActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.syncStatus{margin-top:10px;padding:10px;border:1px solid #25334a;background:#0b1119;border-radius:14px;color:#dbe4ef;font-size:12px;line-height:1.35}.syncStatus.ok{border-color:#2e6b52;background:#10251d}.syncStatus.err{border-color:#743244;background:#2a1218}.switchLine{display:flex;align-items:center;gap:9px;margin-top:10px;color:#dbe4ef;font-weight:900;font-size:13px}.switchLine input{width:20px;height:20px;accent-color:#69f0ae}

@media (min-width:560px){.planDetails{grid-template-columns:repeat(4,1fr)}.planDetails .wide{grid-column:span 2}.tracker{grid-template-columns:1fr 1fr 2fr}.tracker .wide{grid-column:auto}.setupGrid{grid-template-columns:repeat(4,1fr)}.setupGrid .wide{grid-column:span 4}}

/* Polished custom day dropdown + setup refinements */
.dayPickerWrap{position:relative;flex:1;min-width:0}
.dayDropBtn{width:100%;border:1px solid #37556b;background:linear-gradient(135deg,#152234,#101722);color:var(--text);border-radius:20px;padding:14px 46px 14px 16px;font-size:17px;font-weight:1000;letter-spacing:-.01em;text-align:left;box-shadow:0 10px 22px rgba(0,0,0,.18),0 0 0 1px rgba(121,255,184,.06) inset;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayDropBtn::after{content:"⌄";position:absolute;right:17px;top:50%;transform:translateY(-54%);color:var(--accent);font-size:24px;line-height:1;font-weight:1000}
.dayPickerWrap.open .dayDropBtn{border-color:#4a8067;background:linear-gradient(135deg,#18283a,#13251d);box-shadow:0 14px 28px rgba(0,0,0,.24),0 0 0 1px rgba(121,255,184,.18) inset}
.dayMenu{display:none;position:absolute;left:0;right:0;top:calc(100% + 9px);z-index:60;background:rgba(17,24,35,.98);border:1px solid #314158;border-radius:22px;padding:8px;box-shadow:0 18px 44px rgba(0,0,0,.44);backdrop-filter:blur(16px);max-height:70vh;overflow:auto}
.dayPickerWrap.open .dayMenu{display:block;animation:menuIn .16s ease both}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.dayMenuBtn{width:100%;border:1px solid transparent;background:transparent;color:var(--text);border-radius:16px;padding:12px 13px;text-align:left;font-weight:950;font-size:15px;margin:2px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.dayMenuBtn .small{font-size:11px;opacity:.76}

function switchDay(target){
  target=Math.min(Math.max(target,0),PLAN.length-1);
  if(daySwitching)return;
  if(target===current){render();return}
  const main=document.getElementById('main');
  daySwitching=true;
  main.classList.remove('dayEntering');
  main.classList.add('dayLeaving');
  setTimeout(()=>{
    current=target;
    state.currentDay=current;
    state.lastOpenDate=todayISO();
    saveState();
    render();
    const freshMain=document.getElementById('main');
    freshMain.classList.remove('dayLeaving');
    freshMain.classList.add('dayEntering');
    setTimeout(()=>{freshMain.classList.remove('dayEntering');daySwitching=false},520);
  },220);

function suggestedWeightForExercise(ex,level){

  if(t.includes('klimmzüge'))return pick('Latzug: 40–55 kg','BW oder Latzug: 55–75 kg','BW Zusatzgewicht oder Latzug: 75–95 kg');
  if(t.includes('latzug'))return pick('40–55 kg','55–75 kg','75–95 kg');
  if(t.includes('row')||t.includes('rudern')||t.includes('t-bar'))return pick('35–55 kg','55–75 kg','70–95 kg');
  if(t.includes('straight arm'))return pick('15–25 kg','25–40 kg','35–50 kg');
  if(t.includes('reverse')||t.includes('rear delt')||t.includes('face pull'))return pick('15–30 kg','25–45 kg','40–60 kg');

  if(t.includes('schulterdrücken')||t.includes('schulterpresse'))return pick('Maschine: 20–35 kg / KH: 10–16 kg','Maschine: 35–55 kg / KH: 18–26 kg','Maschine: 55–75 kg / KH: 26–34 kg');
  if(t.includes('curl'))return pick('6–10 kg je Hantel / SZ: 15–25 kg','10–15 kg je Hantel / SZ: 25–35 kg','15–22,5 kg je Hantel / SZ: 35–45 kg');
  if(t.includes('trizeps')||t.includes('pushdown')||t.includes('stirndrücken')||t.includes('overhead'))return pick('12,5–22,5 kg','22,5–35 kg','35–50 kg');
  if(t.includes('dips'))return pick('unterstützt / 35–55 kg Maschine','Körpergewicht / 55–75 kg Maschine','Körpergewicht + Zusatz / 75–100 kg Maschine');
  if(t.includes('crunch')||t.includes('ab wheel')||t.includes('leg raises')||t.includes('pallof')||t.includes('side plank'))return pick('BW / Kabel: 20–35 kg','BW / Kabel: 35–50 kg','BW / Kabel: 50–70 kg');
  if(t.includes('kniebeuge')||t.includes('squat')||t.includes('beinpresse')||t.includes('hack'))return pick('Kniebeuge: 40–60 kg / Beinpresse: 90–140 kg','Kniebeuge: 60–90 kg / Beinpresse: 140–210 kg','Kniebeuge: 90–130 kg / Beinpresse: 200–300 kg');
  if(t.includes('kreuzheben'))return pick('50–80 kg','80–120 kg','120–170 kg');
  if(t.includes('rumänisches'))return pick('40–60 kg','60–90 kg','90–130 kg');
  if(t.includes('hip thrust'))return pick('50–80 kg','80–120 kg','120–180 kg');
  if(t.includes('bulgarian')||t.includes('ausfallschritte'))return pick('6–12 kg je Hantel','12–22,5 kg je Hantel','22,5–35 kg je Hantel');
  if(t.includes('beinstrecker'))return pick('25–45 kg','45–70 kg','70–100 kg');
  if(t.includes('beinbeuger'))return pick('20–40 kg','40–60 kg','60–90 kg');
  if(t.includes('waden'))return pick('30–50 kg','50–80 kg','80–120 kg');

  return ex.gewicht||'';
}

function plainWeekdayName(d,i){const text=String((d&&d.title)||' '+((d&&d.sheet)||'')).toLowerCase();const pairs=[['montag','Montag'],['dienstag','Dienstag'],['mittwoch','Mittwoch'],['donnerstag','Donnerstag'],['freitag','Freitag'],['samstag','Samstag'],['sonntag','Sonntag'],['mo ','Montag'],['di ','Dienstag'],['mi ','Mittwoch'],['do ','Donnerstag'],['fr ','Freitag'],['sa ','Samstag'],['so ','Sonntag']];for(const p of pairs){if(text.includes(p[0]))return p[1];}return ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][i]||('Tag '+(i+1));}
function makeBlankExercise(){return {id:makeId(),kind:'strength',nr:'1',uebung:'',gewicht:'',wdh:'',saetze:'',pause:'',rir:'',warmup:'',hinweis:'',fokus:'',color:'#94a3b8'};}
function clearAllDataConfirm(){if(!confirm('Bist du sicher, dass du alle Daten löschen willst? Alle Übungen außer einer leeren Übung pro Tag werden gelöscht. Übungstitel, WDH, Sätze, Pause, RIR, Hinweise und gespeicherte Trainingseinträge werden geleert. Die Tagesauswahl zeigt danach nur noch die reinen Wochentage.'))return;PLAN=makeEmptyPlan();clearTrainingStorage();state.plan=PLAN;state.currentDay=current;state.lastOpenDate=todayISO();saveState();toast('Alle Daten gelöscht');renderSetup();}
function appResetCard(){return `<section class="toolsCard"><h2>App zurücksetzen</h2><div class="small">Setzt Setup, Tracking-Verlauf, lokale Eingaben und Firebase-Einstellungen auf den Startzustand zurück.</div><button class="btn danger" style="width:100%;margin-top:12px" onclick="appResetConfirm()">App zurücksetzen</button></section>`}
function appResetConfirm(){if(confirm('Bist du sicher, dass du die App zurücksetzen willst? Setup, Tracking-Verlauf, lokale Eingaben und Einstellungen werden gelöscht.')){localStorage.removeItem(STORE_KEY);location.reload()}}
function contributeCard(){return `<section class="toolsCard licenseCard"><h2>Mitentwickeln</h2><div class="small">Willst du Mitentwickeln?</div><a class="repoLink" href="https://github.com/hamujuls/FitLog">GitHub Repository öffnen</a></section>`}
function licenseCard(){return `<section class="toolsCard licenseCard"><h2>Lizenz</h2><div class="small">Diese Software steht unter der Lizenz</div><div class="licenseName">CC NC-SA 4.0</div><div class="small" style="margin-top:8px">Kurz gesagt: Du darfst die Software teilen und weiterentwickeln, solange du sie nicht kommerziell nutzt und deine Änderungen unter derselben Lizenz weitergibst.</div></section>`}

function setFirebaseField(field,val){state.firebase=state.firebase||{};state.firebase[field]=val;ensureFirebaseDefaults();saveStateLocalOnly();updateSyncStatus('Firebase ist fix eingerichtet.');connectFirebase(false);}
async function setUserId(val,loadNow=false){state.firebase=state.firebase||{};state.firebase.userId=String(val||'').trim().replace(/[^a-zA-Z0-9_\-.]/g,'_');ensureFirebaseDefaults();saveStateLocalOnly();if(firebaseUnsub){firebaseUnsub();firebaseUnsub=null;}if(firebaseReadyFields()){await connectFirebase(false);if(loadNow) await loadFromCloud(false,true);else await pushToCloud(false);}return true;}
function copyUserId(){ensureFirebaseDefaults();const id=syncId();if(navigator.clipboard){navigator.clipboard.writeText(id).then(()=>toast('Benutzer ID kopiert')).catch(()=>toast(id));}else toast(id)}
function requestUserIdChange(){showModal(`<h2>Benutzer ID ändern?</h2><p class="small">Wenn du die Benutzer ID änderst, werden danach automatisch die Daten dieser ID verwendet und synchronisiert.</p><div class="actions"><button class="btn primary" onclick="openUserIdInput()">Ja, ändern</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`)}
function openUserIdInput(){ensureFirebaseDefaults();const current=attr(syncId());showModal(`<h2>Benutzer ID eingeben</h2><p class="small">Gib die Benutzer ID ein, deren Trainingsplan und gespeicherte Werte verwendet werden sollen.</p><input id="newUserIdInput" class="userIdChangeInput" value="${current}" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="actions"><button class="btn primary" onclick="confirmUserIdChange()">Übernehmen</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`,{upperHalf:true});setTimeout(()=>{const el=document.getElementById('newUserIdInput');if(el){el.focus();el.select();watchModalViewport();setTimeout(keepActiveModalFieldVisible,280);}},80)}
function confirmUserIdChange(){const el=document.getElementById('newUserIdInput');const id=String(el&&el.value?el.value:'').trim().replace(/[^a-zA-Z0-9_\-.]/g,'_');if(!id){alert('Bitte eine Benutzer ID eingeben.');return;}setUserId(id,true).then(()=>{render();toast('Benutzer ID geändert');});closeModal();}
function firebaseConfig(){return Object.assign({},FIREBASE_DEFAULT_CONFIG)}
function firebaseReadyFields(){ensureFirebaseDefaults();const f=state.firebase||{};return !!(f.userId&&FIREBASE_DEFAULT_CONFIG.apiKey&&FIREBASE_DEFAULT_CONFIG.authDomain&&FIREBASE_DEFAULT_CONFIG.projectId&&FIREBASE_DEFAULT_CONFIG.appId)}
function syncId(){ensureFirebaseDefaults();return String((state.firebase&&state.firebase.userId)||'').trim().replace(/[^a-zA-Z0-9_\-.]/g,'_')||'user'}
function syncSubline(){return firebaseReady?'Firebase Sync aktiv':'lokal gespeichert'}
function updateSyncBadge(){const b=document.getElementById('syncBadge');if(!b)return;b.className='syncBadge'+(firebaseReady?' on':(cloudStatus&&cloudStatus.toLowerCase().includes('fehler')?' err':''));b.textContent=firebaseReady?'sync':'lokal'}
function updateSyncStatus(msg, cls=''){cloudStatus=msg||cloudStatus;const el=document.getElementById('syncStatus');if(el){el.textContent=cloudStatus;el.className='syncStatus '+(cls||(firebaseReady?'ok':''));}updateSyncBadge();}
async function connectFirebase(manual=false){try{ensureFirebaseDefaults();if(!firebaseReadyFields()){updateSyncStatus('Benutzer ID fehlt.','err');return false;}if(!firebaseFns){const appMod=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js');const fsMod=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js');firebaseFns={...appMod,...fsMod};}if(!firebaseApp){const apps=firebaseFns.getApps();firebaseApp=apps.length?apps[0]:firebaseFns.initializeApp(firebaseConfig());firebaseDb=firebaseFns.getFirestore(firebaseApp);}firebaseReady=true;saveStateLocalOnly();startCloudListener();updateSyncStatus('Firebase verbunden. Automatischer Online-Sync ist aktiv.','ok');if(manual) await loadFromCloud(false);else await pushIfCloudEmpty();return true;}catch(e){firebaseReady=false;updateSyncStatus('Firebase Fehler: '+(e&&e.message?e.message:e),'err');return false;}}
function cloudRef(){if(!firebaseReady||!firebaseFns||!firebaseDb)return null;return firebaseFns.doc(firebaseDb,'gym_tracker_sync',syncId());}
function stateForCloud(){const copy=deepCopy(state);delete copy.firebase;return copy;}
function applyCloudState(cloud){const keepFirebase=state.firebase||{};remoteApplying=true;state=Object.assign({},cloud||{});state.firebase=keepFirebase;ensurePlan();PLAN=state.plan;current=Math.min(Math.max(state.currentDay||0,0),PLAN.length-1);saveStateLocalOnly();remoteApplying=false;render();}
function startCloudListener(){if(firebaseUnsub)firebaseUnsub();const ref=cloudRef();if(!ref)return;firebaseUnsub=firebaseFns.onSnapshot(ref,(snap)=>{if(!snap.exists())return;const data=snap.data()||{};const cloud=data.state||{};if(!cloud.plan)return;const cloudTime=cloud._syncUpdatedAt||data.updatedAt||0;const localTime=state._syncUpdatedAt||0;if(cloudTime>localTime+5){applyCloudState(cloud);updateSyncStatus('Cloud-Update geladen.','ok');}},(e)=>updateSyncStatus('Firebase Listener Fehler: '+e.message,'err'));}
function scheduleCloudSave(){if(remoteApplying)return;if(!firebaseReady||!(state.firebase&&state.firebase.enabled))return;if(cloudSaveTimer)clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(()=>pushToCloud(false),900);}
async function pushToCloud(manual=false){try{if(!firebaseReady){const ok=await connectFirebase(false);if(!ok)return;}const ref=cloudRef();if(!ref)return;await firebaseFns.setDoc(ref,{updatedAt:Date.now(),state:stateForCloud(),app:'trainingsplan-tracker'},{merge:true});updateSyncStatus('', 'ok');if(manual)toast('Cloud gespeichert');}catch(e){updateSyncStatus('Cloud speichern Fehler: '+(e&&e.message?e.message:e),'err');}}
async function pushIfCloudEmpty(){try{const ref=cloudRef();if(!ref||!firebaseFns)return;const snap=await firebaseFns.getDoc(ref);if(!snap.exists())await pushToCloud(false);}catch(e){/* optionaler Erstabgleich konnte nicht geprüft werden */}}
async function loadFromCloud(manual=false,silentMissing=false){try{if(!firebaseReady){const ok=await connectFirebase(false);if(!ok)return false;}const ref=cloudRef();if(!ref)return false;const snap=await firebaseFns.getDoc(ref);if(!snap.exists()){if(!silentMissing)updateSyncStatus('Noch keine Cloud-Daten unter dieser Benutzer ID gefunden.','err');else await pushToCloud(false);return false;}const data=snap.data()||{};if(!data.state){if(!silentMissing)updateSyncStatus('Cloud-Dokument enthält keinen Tracker-State.','err');return false;}applyCloudState(data.state);updateSyncStatus('', 'ok');if(manual)toast('Cloud geladen');return true;}catch(e){updateSyncStatus('Cloud laden Fehler: '+(e&&e.message?e.message:e),'err');return false;}}
function disableFirebase(){if(firebaseUnsub){firebaseUnsub();firebaseUnsub=null;}firebaseReady=false;state.firebase=state.firebase||{};state.firebase.enabled=false;saveStateLocalOnly();updateSyncStatus('Firebase Sync deaktiviert. Lokal speichern bleibt aktiv.');render();}
function backupPayload(){return JSON.stringify(state,null,2)}
function backupFilename(){const stamp=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);return 'trainingsplan_tracker_backup_'+stamp+'.json'}
function createBackupFile(){const data=backupPayload();const filename=backupFilename();try{if(window.AndroidBackup&&typeof AndroidBackup.saveBackup==='function'){AndroidBackup.saveBackup(data,filename);return;}}catch(e){}try{const blob=new Blob([data],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},500);toast('Export-Datei erstellt');}catch(e){showModal(`<h2>Export</h2><p class="small">Die Datei konnte nicht automatisch erstellt werden. Kopiere den Backup-Text manuell.</p><textarea style="min-height:220px">${esc(data)}</textarea><div class="actions"><button class="btn" onclick="closeModal()">Schließen</button></div>`);}}
function triggerBackupImport(){let input=document.getElementById('backupFileInput');if(!input){input=document.createElement('input');input.id='backupFileInput';input.type='file';input.accept='application/json,.json,text/plain';input.style.display='none';input.onchange=function(){handleBackupFileInput(input)};document.body.appendChild(input);}input.value='';input.click();}
function handleBackupFileInput(input){const file=input&&input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>importBackupText(String(reader.result||''));reader.onerror=()=>alert('Backup-Datei konnte nicht gelesen werden.');reader.readAsText(file);}
function importBackupText(text){try{const v=JSON.parse(text);state=v;ensurePlan();PLAN=state.plan;current=Math.min(Math.max(state.currentDay||0,0),PLAN.length-1);state.currentDay=current;saveState();closeModal();render();toast('Backup importiert')}catch(e){alert('Backup konnte nicht gelesen werden.')}}
function copyBackupToClipboard(){const data=backupPayload();if(navigator.clipboard){navigator.clipboard.writeText(data).then(()=>toast('Export kopiert')).catch(()=>createBackupFile());}else createBackupFile();}
function openBackup(){triggerBackupImport()}
function importBackup(){const el=document.getElementById('backupText');if(el)importBackupText(el.value)}
function modalViewportBottom(){const vv=window.visualViewport;return vv?vv.offsetTop+vv.height:window.innerHeight}
function updateKeyboardOffset(){const vv=window.visualViewport;let offset=0;if(vv)offset=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);document.documentElement.style.setProperty('--keyboard-offset',Math.round(offset)+'px')}
function keepActiveModalFieldVisible(){updateKeyboardOffset();const modal=document.getElementById('modal');const sheet=document.getElementById('sheet');const active=document.activeElement;if(!modal||!sheet||!modal.classList.contains('open')||!active||!sheet.contains(active))return;const rect=active.getBoundingClientRect();const bottom=modalViewportBottom()-16;if(rect.bottom>bottom||rect.top<8){try{active.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){active.scrollIntoView();}}}
function watchModalViewport(){updateKeyboardOffset();setTimeout(keepActiveModalFieldVisible,80);setTimeout(keepActiveModalFieldVisible,320)}
if(window.visualViewport){window.visualViewport.addEventListener('resize',watchModalViewport);window.visualViewport.addEventListener('scroll',watchModalViewport)}
window.addEventListener('resize',watchModalViewport);
document.addEventListener('focusin',watchModalViewport,true);
document.addEventListener('focusout',()=>setTimeout(updateKeyboardOffset,80),true);
function showModal(html,options){const modal=document.getElementById('modal');document.getElementById('sheet').innerHTML=html;modal.classList.toggle('persistent',!!(options&&options.persistent));modal.classList.toggle('timerFloating',!!(options&&options.timerFloating));modal.classList.toggle('upperHalf',!!(options&&options.upperHalf));modal.classList.add('open');watchModalViewport()}
function closeModal(){document.getElementById('modal').classList.remove('open','persistent','timerFloating','upperHalf');setTimeout(updateKeyboardOffset,80)}
function handleModalBackdropClick(event){if(event.target.id!=='modal')return;const modal=document.getElementById('modal');if(modal&&modal.classList.contains('persistent'))return;closeModal()}
function toast(msg){const old=document.getElementById('toast');if(old)old.remove();const t=document.createElement('div');t.id='toast';t.textContent=msg;t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#182536;border:1px solid #37556b;color:white;padding:10px 14px;border-radius:999px;font-weight:900;z-index:80;box-shadow:0 10px 24px rgba(0,0,0,.3)';document.body.appendChild(t);setTimeout(()=>t.remove(),1500)}
function blurNumericKeyboardOnDone(e){
  const t=e.target;
  if(!t||!t.matches||!t.matches('input'))return;
  if(e.key==='Enter'||e.keyCode===13){
    e.preventDefault();
    try{t.blur();}catch(_){}
    try{document.activeElement&&document.activeElement.blur&&document.activeElement.blur();}catch(_){}
    return false;
  }
}
document.addEventListener('keydown',blurNumericKeyboardOnDone,true);
document.addEventListener('keyup',blurNumericKeyboardOnDone,true);

try{
  ensureFirebaseDefaults();
  render();
  if(state.firebase.enabled!==false&&firebaseReadyFields()&&!onboardingMode) connectFirebase(false);
}catch(e){
  document.body.innerHTML='<div style="background:#0b0f14;color:#f4f7fb;font-family:system-ui;padding:18px;line-height:1.45"><h1 style="font-size:22px;margin:0 0 10px">App konnte nicht starten</h1><p>Bitte Screenshot davon schicken. Fehler: '+String(e&&e.message?e.message:e).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]})+'</p><button onclick="localStorage.removeItem(\''+STORE_KEY+'\');location.reload()" style="background:#182536;color:white;border:1px solid #37556b;border-radius:14px;padding:12px 14px;font-weight:900">Lokale App-Daten zurücksetzen</button></div>';
}
</script>
</body>
</html>
